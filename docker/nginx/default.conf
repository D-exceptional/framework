# ==========================================================
# APPLICATION SERVER PROXY
# ==========================================================
server {
    listen 80;
    server_name _;

    root /var/www/public;

    index index.php;

    # --------------------------------------------------------
    # Front controller / extensionless URLs
    # --------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------
    # Execute ONLY the front controller
    # --------------------------------------------------------

    location = /index.php {
        include fastcgi_params;

        fastcgi_pass app:9000;

        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }

    # --------------------------------------------------------
    # Block direct PHP file access
    # --------------------------------------------------------

    location ~ \.php$ {
        return 404;
    }

    # --------------------------------------------------------
    # Static assets
    # --------------------------------------------------------

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
        try_files $uri =404;

        access_log off;

        expires 7d;
    }

    # --------------------------------------------------------
    # Well-known files
    # --------------------------------------------------------

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # Security
    # --------------------------------------------------------

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ==========================================================
# PHPMYADMIN PROXY
# ==========================================================
server {
    listen 80;
    server_name db.mysite.com;

    location / {
        proxy_pass http://phpmyadmin:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}